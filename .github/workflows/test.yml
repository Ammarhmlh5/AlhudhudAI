name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sms_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS sms_gateway_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE sms_gateway_test;"

      - name: Run database migrations
        run: |
          cd services/backend
          for f in $(ls migrations/*.sql | sort -V); do
            echo "Running migration: $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d sms_gateway_test -f "$f" || true
          done

      - name: Run go vet
        run: |
          cd services/backend
          # Skip packages that only contain test files (no non-test Go files)
          go vet ./internal/ws/... ./internal/notifications/... ./internal/receiver/... ./internal/queue/... ./internal/auth/... ./internal/balance/... ./internal/cache/... ./internal/channel/... ./internal/db/... ./internal/models/... ./internal/router/... ./internal/redis/... ./internal/tenant/... ./internal/billing/... ./internal/subscription/... ./internal/routing/... ./internal/security/... ./internal/middleware/... ./internal/monitoring/... ./internal/api/... ./internal/audit/... ./internal/config/... ./internal/database/... ./internal/errors/... ./internal/gateway/... ./internal/metrics/... ./internal/promo/... ./internal/referral/... ./internal/resources/... ./internal/rollover/... ./internal/status/... ./internal/tariff/... ./internal/worker/... ./internal/alerting/... ./internal/batch/... ./internal/buffer/... ./internal/currency/... ./internal/dispatcher/... ./internal/accounting/... ./internal/admin/... ./internal/contact/... ./internal/device/... ./internal/dlr/... ./internal/excel/... ./internal/orchestrator/... ./internal/provider/... ./internal/reseller/... ./internal/staff/... ./internal/support/... ./internal/rate_limiter/... ./internal/dedicated_gateway/... ./internal/messages/... 2>&1
          echo "go vet completed"

      - name: Run unit tests
        run: |
          cd services/backend
          go test ./internal/... -v -short -coverprofile=coverage.out
          go tool cover -func=coverage.out | grep total

      - name: Run integration tests
        if: github.event_name == 'push'
        run: |
          cd services/backend
          go test ./tests/... -v -coverprofile=coverage.out

      - name: Run property-based tests
        run: |
          cd services/backend
          go test ./... -run TestBalanceManager_PropertyBased -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/backend/coverage.out
          flags: backend
          name: Backend Coverage

  mobile-gateway-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile_gateway/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/mobile_gateway
          npm ci

      - name: TypeScript type-check
        run: |
          cd apps/mobile_gateway
          npx tsc --noEmit

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Build shared library
        run: |
          cd apps/libs/shared
          npm ci && npm run build

      - name: Install dependencies
        run: |
          cd apps/admin-web
          npm ci

      - name: Run unit tests
        run: |
          cd apps/admin-web
          npm run test:run -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/admin-web/coverage/lcov.info
          flags: frontend
          name: Frontend Coverage

  web-apps-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared library
        run: |
          cd apps/libs/shared
          npm ci && npm run build

      - name: Type-check admin-web
        run: |
          cd apps/admin-web
          npm ci && npx tsc --noEmit

      - name: Type-check client-web
        run: |
          cd apps/client-web
          npm ci && npx tsc --noEmit

      - name: Type-check company-portal (pure JS, skip tsc)
        run: |
          cd apps/company-portal
          npm ci || true
          echo "✅ company-portal is pure JavaScript, no typecheck needed"

      - name: Type-check reseller-web (pure JS, skip tsc)
        run: |
          cd apps/reseller-web
          npm ci || true
          echo "✅ reseller-web is pure JavaScript, no typecheck needed"

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, mobile-gateway-typecheck, web-apps-typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/admin-web
          npm ci

      - name: Install Playwright
        run: |
          cd apps/admin-web
          npx playwright install --with-deps chromium

      - name: Start backend
        run: |
          cd services/backend
          go build -o backend .
          ./backend &
          sleep 5
          curl -f http://localhost:8085/health || echo "Backend health check failed, but continuing"

      - name: Start frontend
        run: |
          cd apps/admin-web
          npm run dev &
          sleep 10

      - name: Run E2E tests
        run: |
          cd apps/admin-web
          npm run test:e2e

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, mobile-gateway-typecheck, web-apps-typecheck, e2e-test]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.backend-test.result }}" == "success" ]]; then echo "✅ Backend Tests: PASSED" >> $GITHUB_STEP_SUMMARY; else echo "❌ Backend Tests: FAILED" >> $GITHUB_STEP_SUMMARY; fi
          if [[ "${{ needs.frontend-test.result }}" == "success" ]]; then echo "✅ Frontend Tests: PASSED" >> $GITHUB_STEP_SUMMARY; else echo "❌ Frontend Tests: FAILED" >> $GITHUB_STEP_SUMMARY; fi
          if [[ "${{ needs.e2e-test.result }}" == "success" ]]; then echo "✅ E2E Tests: PASSED" >> $GITHUB_STEP_SUMMARY; else echo "❌ E2E Tests: FAILED" >> $GITHUB_STEP_SUMMARY; fi
          if [[ "${{ needs.mobile-gateway-typecheck.result }}" == "success" ]]; then echo "✅ Mobile Gateway TypeCheck: PASSED" >> $GITHUB_STEP_SUMMARY; else echo "❌ Mobile Gateway TypeCheck: FAILED" >> $GITHUB_STEP_SUMMARY; fi
          if [[ "${{ needs.web-apps-typecheck.result }}" == "success" ]]; then echo "✅ Web Apps TypeCheck: PASSED" >> $GITHUB_STEP_SUMMARY; else echo "❌ Web Apps TypeCheck: FAILED" >> $GITHUB_STEP_SUMMARY; fi