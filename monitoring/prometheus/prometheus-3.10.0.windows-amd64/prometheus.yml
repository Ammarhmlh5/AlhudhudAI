# Prometheus Configuration for Al-Hudhud SMS Gateway
# Purpose: Metrics collection and monitoring
# Related Requirements: 16.1, 16.2, 16.3, 16.4

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'al-hudhud-sms-gateway'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - "/etc/prometheus/alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Backend API metrics
  - job_name: 'backend-api'
    static_configs:
      - targets: ['localhost:8083']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Redis metrics (using Memurai on port 6379)
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL metrics (using local Postgres on port 5433)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:5433']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
