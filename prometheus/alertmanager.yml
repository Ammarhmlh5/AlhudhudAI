# Alertmanager Configuration for Tariff Pricing System
# Task 35.5: Monitoring Setup
# Requirements: 24.1-24.9

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@alhudhud.com'
  smtp_auth_username: 'alerts@alhudhud.com'
  smtp_auth_password: 'your-smtp-password'
  smtp_require_tls: true

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree for alerts
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by these labels
  group_by: ['alertname', 'component', 'severity']
  
  # Wait time before sending initial notification
  group_wait: 30s
  
  # Wait time before sending notification about new alerts in group
  group_interval: 5m
  
  # Wait time before re-sending notification
  repeat_interval: 4h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: true

    # Financial alerts - notify finance team
    - match:
        component: financial
      receiver: 'finance-team'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 2h

    # Gateway alerts - notify enterprise support
    - match:
        component: gateway
      receiver: 'enterprise-support'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

    # Subscription alerts - notify operations
    - match:
        component: subscriptions
      receiver: 'operations-team'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 2h

    # Database alerts - notify database team
    - match:
        component: database
      receiver: 'database-team'
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Suppress warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component']

  # Suppress specific alerts when system is down
  - source_match:
      alertname: 'CriticalTariffSystemErrorRate'
    target_match_re:
      alertname: '(SlowTariffQueries|LowTariffCacheHitRate|HighTariffCalculationErrors)'

# Receivers - notification destinations
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: 'ops-team@alhudhud.com'
        headers:
          Subject: '[Tariff System] {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          {{ range .Alerts }}
          <hr>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Impact:</strong> {{ .Annotations.impact }}</p>
          <p><strong>Action:</strong> {{ .Annotations.action }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@alhudhud.com'
        headers:
          Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#critical-alerts'
        username: 'Tariff System Alerts'
        icon_emoji: ':rotating_light:'
        title: ':rotating_light: CRITICAL: {{ .GroupLabels.alertname }}'
        title_link: '{{ .ExternalURL }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          *Action Required:* {{ .Annotations.action }}
          *Component:* {{ .Labels.component }}
          *Started:* {{ .StartsAt | since }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    # Uncomment to enable PagerDuty
    # pagerduty_configs:
    #   - service_key: 'your-pagerduty-service-key'
    #     description: '{{ .GroupLabels.alertname }}: {{ .GroupLabels.component }}'

  # Finance team
  - name: 'finance-team'
    email_configs:
      - to: 'finance@alhudhud.com'
        headers:
          Subject: '[Finance Alert] {{ .GroupLabels.alertname }}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#finance-alerts'
        username: 'Tariff System Alerts'
        icon_emoji: ':moneybag:'
        title: ':moneybag: Finance Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Enterprise support team
  - name: 'enterprise-support'
    email_configs:
      - to: 'enterprise-support@alhudhud.com'
        headers:
          Subject: '[Gateway Alert] {{ .GroupLabels.alertname }}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#enterprise-support'
        username: 'Tariff System Alerts'
        icon_emoji: ':office:'
        title: ':office: Gateway Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Gateway:* {{ .Labels.gateway_id }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          *Action:* {{ .Annotations.action }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Operations team
  - name: 'operations-team'
    email_configs:
      - to: 'operations@alhudhud.com'
        headers:
          Subject: '[Operations] {{ .GroupLabels.alertname }}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#operations'
        username: 'Tariff System Alerts'
        icon_emoji: ':gear:'
        title: ':gear: Operations Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Action:* {{ .Annotations.action }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'

  # Database team
  - name: 'database-team'
    email_configs:
      - to: 'database@alhudhud.com'
        headers:
          Subject: '[Database Alert] {{ .GroupLabels.alertname }}'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#database-alerts'
        username: 'Tariff System Alerts'
        icon_emoji: ':floppy_disk:'
        title: ':floppy_disk: Database Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Impact:* {{ .Annotations.impact }}
          *Action:* {{ .Annotations.action }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}warning{{ else }}good{{ end }}'
