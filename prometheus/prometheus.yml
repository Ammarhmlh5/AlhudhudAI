global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hudhud-sms'
    environment: 'production'

# Load alert rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'
  - '/etc/prometheus/admin_alert_rules.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Admin Backend
  - job_name: 'admin-backend'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['admin-backend:9090']
        labels:
          service: 'admin-backend'
          component: 'backend'

  # Main Backend (if it exposes metrics)
  - job_name: 'backend'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
          component: 'backend'

  # PostgreSQL Exporter (optional - requires postgres_exporter)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis Exporter (optional - requires redis_exporter)
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # Node Exporter (optional - for system metrics)
  - job_name: 'node'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'system'
