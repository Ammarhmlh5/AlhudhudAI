# Redis Configuration for High-Performance Message Buffering
# Optimized for < 10ms API response time requirement

# Network Configuration
# =====================

# TCP backlog - number of pending connections
# Higher value for high-concurrency scenarios
tcp-backlog 511

# TCP keepalive - detect dead connections
# Send ACK every 300 seconds
tcp-keepalive 300

# Timeout for idle clients (0 = disabled)
# Keep connections alive for connection pooling
timeout 0

# Memory Management
# =================

# Maximum memory limit
# Adjust based on your system
maxmemory 2gb

# Eviction policy when maxmemory is reached
# allkeys-lru: Evict least recently used keys
# Good for message buffer (old messages can be dropped)
maxmemory-policy allkeys-lru

# Number of samples for LRU algorithm
# Higher = more accurate but slower
# 5 is good balance for performance
maxmemory-samples 5

# Performance Tuning
# ==================

# Disable slow commands for security and performance
# These commands can block Redis
rename-command KEYS ""
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Lazy freeing (async deletion)
# Prevents blocking on large key deletion
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Configuration
# =========================

# RDB Snapshots
# Save if: 900 seconds (15 min) and at least 1 key changed
save 900 1
# Save if: 300 seconds (5 min) and at least 10 keys changed
save 300 10
# Save if: 60 seconds (1 min) and at least 10000 keys changed
save 60 10000

# Compress RDB files
rdbcompression yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir /data

# AOF (Append Only File) - Optional
# ==================================

# Enable AOF for better durability
# Trade-off: Slightly slower writes
appendonly no

# If AOF enabled, use everysec for balance
# appendfsync everysec

# Rewrite AOF when it grows by 100%
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# Logging
# =======

# Log level: debug, verbose, notice, warning
# Use notice in production
loglevel notice

# Log file location
logfile /var/log/redis/redis-server.log

# Slow log configuration
# ======================

# Log queries slower than 10ms (10000 microseconds)
slowlog-log-slower-than 10000

# Keep last 128 slow queries
slowlog-max-len 128

# Client Output Buffer Limits
# ============================

# Prevent slow clients from blocking Redis
# Format: <class> <hard limit> <soft limit> <soft seconds>

# Normal clients (our application)
client-output-buffer-limit normal 0 0 0

# Pub/Sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# Replica clients
client-output-buffer-limit replica 256mb 64mb 60

# Advanced Configuration
# ======================

# Number of I/O threads
# Use 4 threads for better performance on multi-core systems
# Requires Redis 6.0+
io-threads 4
io-threads-do-reads yes

# Disable transparent huge pages (THP)
# THP can cause latency spikes
# Set in system: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Hash optimization
# Use ziplist for small hashes (memory efficient)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Active rehashing
# Use 1ms of CPU time every 100ms for rehashing
activerehashing yes

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol max bulk length
proto-max-bulk-len 512mb

# Frequency of active expiry checks
hz 10

# Enable active defragmentation (Redis 4.0+)
# Helps with memory fragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# Replication (if using Redis Sentinel/Cluster)
# ==============================================

# Replica serves read queries while syncing
replica-serve-stale-data yes

# Replica is read-only
replica-read-only yes

# Disable TCP_NODELAY for replication
# Better throughput, slightly higher latency
repl-disable-tcp-nodelay no

# Replication backlog
repl-backlog-size 1mb
repl-backlog-ttl 3600

# Security
# ========

# Require password (set in production)
# requirepass your_strong_password_here

# Disable protected mode if using password
# protected-mode no

# Bind to specific interface
# bind 127.0.0.1 ::1

# Performance Monitoring
# ======================

# Enable latency monitoring
latency-monitor-threshold 100

# Notes for Production
# =====================

# 1. Tune maxmemory based on your workload
#    - Monitor memory usage
#    - Leave headroom for OS and other processes
#
# 2. Consider disabling persistence for pure cache
#    - Set save "" to disable RDB
#    - Set appendonly no
#    - Faster but risk of data loss
#
# 3. Use Unix socket for local connections
#    - 20-30% faster than TCP
#    - unixsocket /var/run/redis/redis.sock
#    - unixsocketperm 770
#
# 4. Monitor slow queries
#    - redis-cli SLOWLOG GET 10
#    - Optimize application queries
#
# 5. Use Redis Sentinel for high availability
#    - Automatic failover
#    - Better uptime
#
# 6. Consider Redis Cluster for scale
#    - Horizontal scaling
#    - Higher throughput

# Performance Checklist
# =====================

# ✅ Disabled slow commands (KEYS, FLUSHALL)
# ✅ Enabled lazy freeing
# ✅ Configured appropriate maxmemory
# ✅ Set eviction policy (allkeys-lru)
# ✅ Enabled I/O threads (Redis 6.0+)
# ✅ Configured slow log
# ✅ Optimized data structures
# ✅ Enabled active defragmentation
# ✅ Set appropriate persistence
# ✅ Configured client buffers

# Expected Performance
# ====================

# With this configuration:
# - LPUSH: 0.5-1.5ms (local)
# - Pipeline (3 commands): 1-2ms (local)
# - GET: 0.3-0.8ms (local)
# - Throughput: 100k+ ops/sec (single instance)

# Monitoring Commands
# ===================

# Check latency:
#   redis-cli --latency
#   redis-cli --latency-history
#
# Check stats:
#   redis-cli INFO stats
#   redis-cli INFO memory
#
# Check slow log:
#   redis-cli SLOWLOG GET 10
#
# Monitor commands:
#   redis-cli MONITOR (use sparingly in production)
