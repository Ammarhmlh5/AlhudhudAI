# ================================================================
# Redis Configuration for Al-Hudhud SMS Platform
# ================================================================
# Version: 1.0
# Date: 2026-03-22
# Purpose: Security and Performance Optimizations
# ================================================================

# ================================================================
# NETWORK CONFIGURATION
# ================================================================

# Bind to localhost only - Redis will NOT be accessible from outside
# This is critical for security in production
bind 127.0.0.1

# Accept connections on the specified port
port 6379

# TCP listen() backlog
# In high requests-per-second environments you need a high backlog
tcp-backlog 511

# Close the connection after a client is idle for N seconds (0 to disable)
# Recommended: 300 seconds (5 minutes)
timeout 300

# TCP keepalive
# Send TCP ACKs to clients every N seconds
tcp-keepalive 300

# ================================================================
# SECURITY CONFIGURATION
# ================================================================

# Require clients to authenticate before processing any commands
# IMPORTANT: Replace with a strong password generated using:
# openssl rand -base64 32
requirepass K7mP9xR2vN4wQ8tL5jH3bF6yC1zX0sA9

# Disable dangerous commands that can cause data loss or security issues
# These commands will be completely unavailable
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command DEBUG ""
rename-command KEYS ""

# ================================================================
# MEMORY MANAGEMENT
# ================================================================

# Set a memory usage limit
# Adjust based on your server's available RAM
# Development: 256MB, Staging: 512MB, Production: 2GB+
# IMPORTANT: Update this value based on your environment
maxmemory 2gb

# How Redis will select what to remove when maxmemory is reached
# allkeys-lru: Evict any key using LRU algorithm
maxmemory-policy allkeys-lru

# LRU and minimal TTL algorithms are not precise but approximated
# You can tune it for speed or accuracy
maxmemory-samples 5

# ================================================================
# LAZY FREEING
# ================================================================
# Redis can free memory in a non-blocking way
# This improves performance when deleting large keys

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ================================================================
# APPEND ONLY FILE (AOF) PERSISTENCE
# ================================================================
# AOF provides better durability than RDB snapshots
# It logs every write operation

# Enable AOF
appendonly yes

# The name of the append only file
appendfilename "appendonly.aof"

# fsync() call frequency
# everysec: fsync every second (good balance between performance and durability)
appendfsync everysec

# Rewrite the AOF file in background when it gets too big
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ================================================================
# RDB SNAPSHOTS (BACKUP)
# ================================================================
# Save the DB on disk periodically
# Format: save <seconds> <changes>

# After 900 sec (15 min) if at least 1 key changed
save 900 1

# After 300 sec (5 min) if at least 10 keys changed
save 300 10

# After 60 sec if at least 10000 keys changed
save 60 10000

# Compress RDB files using LZF
rdbcompression yes

# Add a CRC64 checksum at the end of the file
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory
# The DB will be written inside this directory
dir /var/lib/redis

# ================================================================
# LOGGING
# ================================================================

# Specify the server verbosity level
# Options: debug, verbose, notice, warning
loglevel notice

# Specify the log file name
# Empty string = log to stdout
logfile "/var/log/redis/redis-server.log"

# To enable logging to the system logger, just set 'syslog-enabled' to yes
syslog-enabled no

# ================================================================
# GENERAL
# ================================================================

# Set the number of databases
# Default: 16 (0-15)
databases 16

# By default Redis shows an ASCII art logo only when started in interactive mode
always-show-logo no

# ================================================================
# CLIENTS
# ================================================================

# Set the max number of connected clients at the same time
maxclients 10000

# ================================================================
# SLOW LOG
# ================================================================
# The Redis Slow Log is a system to log queries that exceeded a specified execution time

# Execution time in microseconds (1000000 = 1 second)
slowlog-log-slower-than 10000

# Maximum length of the slow log
slowlog-max-len 128

# ================================================================
# LATENCY MONITOR
# ================================================================
# The Redis latency monitoring subsystem samples different operations at runtime

# Latency threshold in milliseconds
latency-monitor-threshold 100

# ================================================================
# EVENT NOTIFICATION
# ================================================================
# Redis can notify Pub/Sub clients about events happening in the key space

# Disabled by default (empty string)
notify-keyspace-events ""

# ================================================================
# ADVANCED CONFIG
# ================================================================

# Hashes are encoded using a memory efficient data structure when they have a
# small number of entries
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Lists are also encoded in a special way to save space
list-max-ziplist-size -2
list-compress-depth 0

# Sets have a special encoding when they are composed of just strings
set-max-intset-entries 512

# Sorted sets are specially encoded when they have a small number of entries
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation bytes limit
hll-sparse-max-bytes 3000

# Streams macro node max size / items
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing uses 1 millisecond every 100 milliseconds of CPU time
activerehashing yes

# The client output buffer limits can be used to force disconnection of clients
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Redis calls an internal function to perform many background tasks
hz 10

# Enable active defragmentation
activedefrag yes

# Minimum amount of fragmentation waste to start active defrag
active-defrag-ignore-bytes 100mb

# Minimum percentage of fragmentation to start active defrag
active-defrag-threshold-lower 10

# Maximum percentage of fragmentation at which we use maximum effort
active-defrag-threshold-upper 100

# Minimal effort for defrag in CPU percentage
active-defrag-cycle-min 5

# Maximal effort for defrag in CPU percentage
active-defrag-cycle-max 75

# ================================================================
# END OF CONFIGURATION
# ================================================================
