# ================================================================
# Redis Configuration for Al-Hudhud SMS Platform - DEVELOPMENT
# ================================================================
# Version: 1.0
# Date: 2026-03-23
# Purpose: Development-optimized Redis configuration
# ================================================================

# Include base configuration
include /path/to/redis.conf

# ================================================================
# DEVELOPMENT OVERRIDES
# ================================================================

# Development memory limit (minimal)
maxmemory 256mb

# Development connection limits
maxclients 500

# Development logging (verbose for debugging)
loglevel debug
logfile "/var/log/redis/redis-dev.log"

# Less frequent snapshots for development
save 900 1

# Slower log threshold for development (50ms)
slowlog-log-slower-than 50000
slowlog-max-len 64
