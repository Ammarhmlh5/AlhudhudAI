# ================================================================
# Redis Configuration for Al-Hudhud SMS Platform - PRODUCTION
# ================================================================
# Version: 1.0
# Date: 2026-03-23
# Purpose: Production-optimized Redis configuration
# ================================================================

# Include base configuration
include /path/to/redis.conf

# ================================================================
# PRODUCTION OVERRIDES
# ================================================================

# Production memory limit (adjust based on your server)
maxmemory 4gb

# Stricter timeout for production
timeout 180

# More aggressive connection limits
maxclients 5000

# Production logging
loglevel notice
logfile "/var/log/redis/redis-production.log"

# Enable syslog for production monitoring
syslog-enabled yes
syslog-ident redis-alhudhud-prod
syslog-facility local0

# More frequent snapshots for production
save 900 1
save 300 10
save 60 10000
save 30 100000

# AOF rewrite thresholds for production
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 128mb

# Slower log threshold for production (5ms)
slowlog-log-slower-than 5000
slowlog-max-len 256

# Enable latency monitoring
latency-monitor-threshold 50

# Production-optimized defragmentation
active-defrag-threshold-lower 5
active-defrag-threshold-upper 50
active-defrag-cycle-min 10
active-defrag-cycle-max 50
