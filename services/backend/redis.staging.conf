# ================================================================
# Redis Configuration for Al-Hudhud SMS Platform - STAGING
# ================================================================
# Version: 1.0
# Date: 2026-03-23
# Purpose: Staging-optimized Redis configuration
# ================================================================

# Include base configuration
include /path/to/redis.conf

# ================================================================
# STAGING OVERRIDES
# ================================================================

# Staging memory limit
maxmemory 1gb

# Staging connection limits
maxclients 2000

# Staging logging (more verbose for debugging)
loglevel verbose
logfile "/var/log/redis/redis-staging.log"

# Less frequent snapshots for staging
save 900 1
save 300 100

# Slower log threshold for staging (10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128
